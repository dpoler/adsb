name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev \
            libcurl4-openssl-dev pkg-config python3

      - name: Configure (SDL)
        run: cmake -S . -B build -DPI_DISPLAY_BACKEND=SDL

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package binary
        run: |
          cp build/pi/flightlevel314 flightlevel314-linux-x86_64
          chmod +x flightlevel314-linux-x86_64

      - name: Create release and attach binary
        uses: softprops/action-gh-release@v2
        with:
          files: flightlevel314-linux-x86_64
          generate_release_notes: true
